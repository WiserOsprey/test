name: Build Reedwake BPS patch

on:
  push:
    branches:
      - scientific-fantasy-build
    paths:
      - .github/workflows/build-reedwake-patch.yml
      - tools/create_bps.py
      - tools/smoke_boot.c
      - tools/install_science_palette.py
      - tools/install_evolution_species.py
      - tools/install_delta_lab.py
      - tools/reedwake_delta/**
      - data/reedwake/**
      - tools/install_rillfin_sprites.py
      - tools/install_fernut_sprites.py
      - tools/emerald_sprites.py
      - tools/install_title_screen.py
      - tools/reedwake_title.c
      - assets/title/**
      - assets/lockmere/**
      - assets/seedvault/**
      - assets/kitewatch/**
      - assets/coilmarket/**
      - tools/install_kitewatch.py
      - tools/kitewatch_wind.inc
      - tools/install_coilmarket.py
      - tools/coilmarket_grid.inc
      - tools/install_reedwake_overworld.py
      - tools/install_reedwake_timeline.py
      - tools/reedwake_timeline.inc
      - tools/reedwake_timeline_menu.inc
      - tools/test_reedwake_timeline.c
      - tools/reedwake_district_assets.py
      - tools/install_seedvault.py
      - tools/seedvault_lights.inc
      - tools/install_lockmere.py
      - tools/lockmere_gates.inc
      - assets/rillfin/**
      - assets/fernut/**
      - assets/cindrix/**
      - assets/peathare/**
      - assets/siltstilt/**
      - assets/podtick/**
      - assets/bendruff/**
      - assets/delta_starters/**
      - assets/bogrel/**
      - assets/mirehart/**
      - assets/reedrake/**
      - assets/fenstilt/**
      - assets/silkettle/**
      - assets/latchwing/**
      - assets/bramblet/**
      - assets/canoplate/**
      - assets/flareden/**
      - assets/vulprism/**
      - assets/estuarch/**
      - Pokemon - Emerald Version (U).gba
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean Emerald base repository
        uses: actions/checkout@v4

      - name: Checkout Reedwake source patches and assets
        uses: actions/checkout@v4
        with:
          repository: WiserOsprey/airomhacktests
          ref: scientific-fantasy-overhaul
          path: hack

      - name: Checkout Emerald decompilation at the patch base revision
        uses: actions/checkout@v4
        with:
          repository: pret/pokeemerald
          ref: 9103e529c2fbdd7add4a1ff3350c6c1f92112c42
          path: source

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: source/agbcc

      - name: Verify the supplied ROM is clean US Emerald
        run: |
          echo "f3ae088181bf583e55daf962a92bb46f4f1d07b7  Pokemon - Emerald Version (U).gba" | sha1sum --check -

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev libmgba-dev python3-pil

      - name: Build agbcc
        working-directory: source/agbcc
        run: |
          ./build.sh
          ./install.sh ../

      - name: Apply Reedwake opening patch and fitted Pokédex changes
        run: |
          git -C source apply --binary "$GITHUB_WORKSPACE/hack/Reedwake - Source.patch"
          mkdir -p source/graphics/pokedex/purple
          cp hack/purple-pokedex-gba/background.4bpp source/graphics/pokedex/purple/background.4bpp
          cp hack/purple-pokedex-gba/list_underlay.bin source/graphics/pokedex/purple/list_underlay.bin
          cp hack/purple-pokedex-gba/background.gbapal source/graphics/pokedex/purple/background.gbapal
          cp hack/purple-pokedex-gba/fitted/foreground.4bpp source/graphics/pokedex/purple/foreground.4bpp
          cp hack/purple-pokedex-gba/fitted/foreground.tilemap source/graphics/pokedex/purple/foreground.tilemap
          cp hack/purple-pokedex-gba/fitted/foreground.gbapal source/graphics/pokedex/purple/foreground.gbapal
          git -C source apply --binary "$GITHUB_WORKSPACE/hack/purple-pokedex-gba/fitted/pokedex-foreground.patch"
          git -C source apply --binary "$GITHUB_WORKSPACE/hack/purple-pokedex-gba/fitted/bulbasaur-field-notes.patch"
          git -C source apply --binary "$GITHUB_WORKSPACE/hack/purple-pokedex-gba/fitted/research-delta/research-delta.patch"
          python3 hack/tools/install_science_palette.py "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/hack/purple-pokedex-gba/science-fantasy/bg_science_fantasy.pal"
          python3 tools/install_evolution_species.py data/reedwake/regional_dex.json "$GITHUB_WORKSPACE/source"
          python3 tools/install_rillfin_sprites.py assets/rillfin/front.png assets/rillfin/back_concept.png assets/rillfin/normal.pal source/graphics/pokemon/mudkip
          python3 tools/install_fernut_sprites.py assets/fernut/front_concept.png assets/fernut/back_concept.png source/graphics/pokemon/treecko
          python3 tools/install_fernut_sprites.py assets/cindrix/front_concept.png assets/cindrix/back_concept.png source/graphics/pokemon/torchic
          python3 tools/install_fernut_sprites.py assets/peathare/front_concept.png assets/peathare/back_concept.png source/graphics/pokemon/poochyena
          python3 tools/install_fernut_sprites.py assets/siltstilt/front_concept.png assets/siltstilt/back_concept.png source/graphics/pokemon/zigzagoon
          python3 tools/install_fernut_sprites.py assets/podtick/front_concept.png assets/podtick/back_concept.png source/graphics/pokemon/wurmple
          python3 tools/install_fernut_sprites.py assets/bendruff/front.png assets/bendruff/back.png source/graphics/pokemon/marshtomp
          python3 tools/install_fernut_sprites.py assets/bramblet/front.png assets/bramblet/back.png source/graphics/pokemon/grovyle
          python3 tools/install_fernut_sprites.py assets/canoplate/front.png assets/canoplate/back.png source/graphics/pokemon/sceptile
          python3 tools/install_fernut_sprites.py assets/flareden/front.png assets/flareden/back.png source/graphics/pokemon/combusken
          python3 tools/install_fernut_sprites.py assets/vulprism/front.png assets/vulprism/back.png source/graphics/pokemon/blaziken
          python3 tools/install_fernut_sprites.py assets/estuarch/front.png assets/estuarch/back.png source/graphics/pokemon/swampert
          python3 tools/install_fernut_sprites.py assets/bogrel/front.png assets/bogrel/back.png source/graphics/pokemon/mightyena
          python3 tools/install_fernut_sprites.py assets/mirehart/front.png assets/mirehart/back.png source/graphics/pokemon/absol
          python3 tools/install_fernut_sprites.py assets/reedrake/front.png assets/reedrake/back.png source/graphics/pokemon/linoone
          python3 tools/install_fernut_sprites.py assets/fenstilt/front.png assets/fenstilt/back.png source/graphics/pokemon/skarmory
          python3 tools/install_fernut_sprites.py assets/silkettle/front.png assets/silkettle/back.png source/graphics/pokemon/silcoon
          python3 tools/install_fernut_sprites.py assets/latchwing/front.png assets/latchwing/back.png source/graphics/pokemon/beautifly
          python3 tools/install_fernut_sprites.py assets/lockmere/siltmole/front.png assets/lockmere/siltmole/back.png source/graphics/pokemon/geodude
          python3 tools/install_fernut_sprites.py assets/lockmere/gategrub/front.png assets/lockmere/gategrub/back.png source/graphics/pokemon/graveler
          python3 tools/install_fernut_sprites.py assets/lockmere/lockmole/front.png assets/lockmere/lockmole/back.png source/graphics/pokemon/golem
          python3 tools/install_fernut_sprites.py assets/seedvault/sporelet/front.png assets/seedvault/sporelet/back.png source/graphics/pokemon/shroomish
          python3 tools/install_fernut_sprites.py assets/seedvault/budwing/front.png assets/seedvault/budwing/back.png source/graphics/pokemon/breloom
          python3 tools/install_fernut_sprites.py assets/seedvault/graftwing/front.png assets/seedvault/graftwing/back.png source/graphics/pokemon/heracross
          python3 tools/install_fernut_sprites.py assets/kitewatch/gullit/front.png assets/kitewatch/gullit/back.png source/graphics/pokemon/taillow
          python3 tools/install_fernut_sprites.py assets/kitewatch/vaneagle/front.png assets/kitewatch/vaneagle/back.png source/graphics/pokemon/swellow
          python3 tools/install_fernut_sprites.py assets/kitewatch/galegull/front.png assets/kitewatch/galegull/back.png source/graphics/pokemon/tropius
          python3 tools/install_fernut_sprites.py assets/coilmarket/tramkit/front.png assets/coilmarket/tramkit/back.png source/graphics/pokemon/electrike
          python3 tools/install_fernut_sprites.py assets/coilmarket/voltrack/front.png assets/coilmarket/voltrack/back.png source/graphics/pokemon/manectric
          python3 tools/install_fernut_sprites.py assets/coilmarket/arcrail/front.png assets/coilmarket/arcrail/back.png source/graphics/pokemon/plusle
          python3 tools/install_delta_lab.py data/reedwake/regional_dex.json "$GITHUB_WORKSPACE/source" assets/delta_starters
          python3 tools/install_lockmere.py "$GITHUB_WORKSPACE/source" assets/lockmere
          python3 tools/install_seedvault.py "$GITHUB_WORKSPACE/source" assets/seedvault
          python3 tools/install_kitewatch.py "$GITHUB_WORKSPACE/source" assets/kitewatch
          python3 tools/install_coilmarket.py "$GITHUB_WORKSPACE/source" assets/coilmarket
          python3 tools/install_reedwake_overworld.py "$GITHUB_WORKSPACE/source"
          python3 tools/install_reedwake_timeline.py "$GITHUB_WORKSPACE/source"

          python3 tools/install_title_screen.py assets/title/observatory.png "$GITHUB_WORKSPACE/source"

      - name: Build the ROM
        working-directory: source
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          MODERN: 0
          COMPARE: 0
        run: make -j2 all


      - name: Check the battle timeline scheduler
        run: |
          cc -std=c99 -O2 tools/test_reedwake_timeline.c -o "$RUNNER_TEMP/reedwake-timeline-test"
          "$RUNNER_TEMP/reedwake-timeline-test"

      - name: Boot the ROM in mGBA
        run: |
          cc -std=gnu11 -O2 tools/smoke_boot.c -o "$RUNNER_TEMP/reedwake-smoke" -lmgba
          elf=source/pokeemerald.elf
          arm-none-eabi-nm "$elf" > "$RUNNER_TEMP/reedwake-symbols.txt"
          symbol() {
            awk -v name="$1" '$3 == name { print $1; found = 1; exit } END { if (!found) exit 1 }' "$RUNNER_TEMP/reedwake-symbols.txt"
          }
          main_addr=$(symbol gMain)
          intro_addr=$(symbol MainCB2_Intro)
          title_addr=$(symbol CB2_ReedwakeTitle)
          menu_addr=$(symbol CB2_InitMainMenu)
          "$RUNNER_TEMP/reedwake-smoke" source/pokeemerald.gba "$main_addr" "$intro_addr" "$title_addr" "$menu_addr"

      - name: Create distributable BPS patch
        run: |
          mkdir -p dist
          python3 tools/create_bps.py "Pokemon - Emerald Version (U).gba" source/pokeemerald.gba dist/Reedwake-Scientific-Fantasy.bps
          cat > dist/README.txt <<'EOF'
          Reedwake: The Resonant Tide — Coilmarket build

          Patch format: BPS
          Required base: unmodified US Pokémon Emerald, revision 0
          Required base SHA1: f3ae088181bf583e55daf962a92bb46f4f1d07b7

          Apply the BPS patch to a legally obtained clean base ROM with a BPS patcher.
          This artifact contains the patch only; it does not contain the game ROM.

          Start a new game to play the Brackenhaven opening. Complete Iona's
          first battle at Tide Reach, then return to the lab and get the Pokédex.
          Use the machine by the lab wall to read your party's Delta trial hints.
 
          Head west through Reedbank Path, then north through the woods to
          Lockmere. Open the intake and use the gauge to drain the upper lock.
          Defeat Tamsin for the first badge, then talk to the survey ferryman
          just south of the Lockmere Gym. Follow the mirrors in Seedvault to
          challenge Pell for the second badge. Then take the ridge ferry from
          Seedvault to Kitewatch and shift the platforms to challenge Venn.
          After Venn, talk to the survey tram operator south of the Kitewatch
          Pokémon Center. Read the live meter in Coilmarket's substation and
          route power to the tram to reach Brin for the fourth badge.
          In single battles, open FIGHT and press L to add a move. Press R
          to cycle its intended position, B to undo, and START to commit.
          Your badges determine the queue limit. Press A for a normal move.
          On a reaction prompt, A clashes, B guards, and R dodges.
          Up dodges to air, down underground, and right behind, when eligible.
          Later districts still use Emerald maps.
          EOF

      - name: Upload BPS patch only
        uses: actions/upload-artifact@v4
        with:
          name: Reedwake-Scientific-Fantasy-BPS
          path: |
            dist/Reedwake-Scientific-Fantasy.bps
            dist/README.txt
          if-no-files-found: error
          retention-days: 30
